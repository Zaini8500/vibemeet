<!doctype html><html><head><meta charset="utf-8"><title>VibeMeet Admin</title><link rel="stylesheet" href="styles.css"></head>
<body><h1>VibeMeet Admin</h1><p>RBAC: admin / moderator. This dashboard calls the backend <code>/admin/*</code> APIs with a JWT. Replace the dev role header with a DB-backed role lookup before public deployment (see backend middleware/auth.ts).</p>
<label>Backend URL <input id="base" value="http://localhost:8080"></label>
<label>JWT <input id="token" placeholder="Bearer token (paste, never commit)"></label>
<label>Role <select id="role"><option>moderator</option><option>admin</option></select></label>
<button onclick="loadReports()">Load open reports</button>
<button onclick="loadAnalytics()">Analytics (7d)</button>
<pre id="out">No data yet.</pre>
<script src="app.js"></script></body></html>
