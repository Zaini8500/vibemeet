services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vibemeet
      POSTGRES_USER: vibemeet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://vibemeet:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/vibemeet
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      PORT: "8080"
    ports: ["8080:8080"]
    depends_on: [postgres, redis]
volumes:
  pgdata:
