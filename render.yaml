services:
  - type: web
    name: vibemeet-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APPLY_SCHEMA
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: vibemeet-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: vibemeet-cache
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 395071022050-j6bh5mpkbripkmnv2kr8ehtlh1ioplvs.apps.googleusercontent.com
  - type: keyvalue
    name: vibemeet-cache
    plan: free
    ipAllowList: [] # Only allow internal connections from Render services
databases:
  - name: vibemeet-db
    databaseName: vibemeet
    plan: free
    postgresMajorVersion: "16"
